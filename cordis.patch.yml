# dsh bundle patch: inserts this plugin into a profile's layer stack.
# Applied as its own bundle layer once `dsh plugin --profile web add .`
# reconciles `dsh.profile.bundles` (the package.json `dsh.bundle.patch`
# declaration drives both the layer membership and this file's role).
- insert:
    - id: scroll-flow
      name: '@deepseek-ai/dsh-client-ui-scroll-flow'
